<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DayZ Map</title>
    <meta name="description" content="Prosta interaktywna mapa DayZ (Nasdara, Namalsk, Sakhal, Chernarus+, Livonia): nazwy miejsc, szpitale, woda, wojsko, policja, paliwo i pojazdy.">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
          integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <a class="home-link" href="https://janczura.dev">janczura.dev</a>
    <span class="sep" aria-hidden="true">/</span>
    <span class="title">DayZ Map</span>
    <input class="search" id="search" type="search" list="places" placeholder="Szukaj miejsca…" aria-label="Szukaj miejsca" autocomplete="off">
    <datalist id="places"></datalist>
    <nav class="maps" id="maps" aria-label="Wybór mapy"></nav>
</header>

<main class="stage">
    <div id="map"></div>

    <details class="panel" id="panel" open>
        <summary>Filtry</summary>
        <div class="bulk">
            <button type="button" id="all">Włącz wszystkie</button>
            <button type="button" id="none">Wyłącz wszystkie</button>
        </div>
        <div id="filters"></div>
    </details>

    <output class="coords" id="coords"></output>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
