<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DayZ Map</title>
    <meta name="description" content="Prosta interaktywna mapa DayZ (Nasdara, Namalsk, Sakhal, Chernarus+, Livonia): nazwy miejsc, współrzędne GPS, szpitale, woda, jedzenie, wojsko, policja, paliwo, pojazdy, zwierzęta, strefy łupu i bunkry z kodem.">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
          integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <a class="home-link" href="https://janczura.dev">janczura.dev</a>
    <span class="sep" aria-hidden="true">/</span>
    <span class="title">DayZ Map</span>
    <input class="search" id="search" type="search" list="places" placeholder="Miejsce, GPS lub kod z radia…"
           title="Nazwa miejsca, współrzędne z gry (np. 072 106) albo komunikat bunkrów z radia: cyfry lub Morse (. i -)"
           aria-label="Szukaj miejsca, współrzędnych GPS lub komunikatu bunkrów" autocomplete="off">
    <datalist id="places"></datalist>
    <nav class="maps" id="maps" aria-label="Wybór mapy"></nav>
</header>

<main class="stage">
    <div id="map"></div>

    <details class="panel" id="panel" open>
        <summary>Filtry</summary>
        <div class="bulk">
            <button type="button" id="all">Włącz wszystkie</button>
            <button type="button" id="none">Wyłącz wszystkie</button>
        </div>
        <div id="filters"></div>
    </details>

    <details class="radio" id="radio" hidden>
        <summary>📻 Nasłuch bunkrów</summary>
        <p>Radio w grze na 80,0 MHz, nadaje nocą (17:45–06:00 czasu gry). Przycisz efekty i wyłącz muzykę w grze.
            „Dźwięk z gry” działa w Chrome i Edge: wybierz okno DayZ i włącz udostępnianie dźwięku.</p>
        <div class="bulk">
            <button type="button" id="radio-game">Dźwięk z gry</button>
            <button type="button" id="radio-mic">Mikrofon</button>
            <button type="button" id="radio-stop">Stop</button>
        </div>
        <output id="radio-status">Nie słucham.</output> <meter id="radio-level" min="0" max="40" low="22" optimum="40"></meter>
        <output id="radio-marks"></output>
        <ol id="radio-heard"></ol>
    </details>

    <output class="coords" id="coords"></output>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
